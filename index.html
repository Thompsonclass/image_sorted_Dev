<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이미지 정렬 프로</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                800: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";

        /* Light Theme */
        --bg-light: #f8fafc;
        --card-bg-light: #ffffff;
        --text-primary-light: #0f172a;
        --text-secondary-light: #64748b;
        --border-light: #e2e8f0;
        --primary-light: #3b82f6;
        --primary-hover-light: #2563eb;
        --secondary-light: #f1f5f9;
        --secondary-hover-light: #e2e8f0;
        --danger-light: #ef4444;
        --danger-hover-light: #dc2626;

        /* Dark Theme */
        --bg-dark: #020617;
        --card-bg-dark: #0f172a;
        --text-primary-dark: #f8fafc;
        --text-secondary-dark: #94a3b8;
        --border-dark: #334155;
        --primary-dark: #3b82f6;
        --primary-hover-dark: #60a5fa;
        --secondary-dark: #1e293b;
        --secondary-hover-dark: #334155;
        --danger-dark: #f87171;
        --danger-hover-dark: #ef4444;
      }

      /* Base styles */
      body {
        font-family: var(--font-sans);
        background-color: var(--bg-light);
        color: var(--text-primary-light);
        transition: background-color 0.3s, color 0.3s;
      }

      .dark body {
        background-color: var(--bg-dark);
        color: var(--text-primary-dark);
      }

      .app-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 1.5rem;
      }

      /* Header */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        background-color: rgba(255, 255, 255, 0.5);
        border-bottom: 1px solid var(--border-light);
        border-radius: 1rem;
        backdrop-filter: blur(10px);
        position: sticky;
        top: 1.5rem;
        z-index: 10;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      }
      .dark header {
        background-color: rgba(15, 23, 42, 0.5);
        border-bottom-color: var(--border-dark);
      }
      header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--text-primary-light);
      }
      .dark header h1 {
        color: var(--text-primary-dark);
      }
      header p {
        margin-top: 0.25rem;
        font-size: 1rem;
        color: var(--text-secondary-light);
      }
      .dark header p {
        color: var(--text-secondary-dark);
      }

      /* Main content */
      main {
        margin-top: 2.5rem;
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
      }

      /* Cards */
      .card-container {
        padding: 1.5rem 2rem;
        background-color: var(--card-bg-light);
        border: 1px solid var(--border-light);
        border-radius: 1rem;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
      }
      .dark .card-container {
        background-color: var(--card-bg-dark);
        border-color: var(--border-dark);
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .section-header h2 {
        font-size: 1.5rem;
        font-weight: 600;
      }
      .section-header p {
        color: var(--text-secondary-light);
        font-size: 0.9rem;
        margin-top: 0.25rem;
      }
      .dark .section-header p {
        color: var(--text-secondary-dark);
      }

      /* Action Buttons */
      .action-buttons-group {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .action-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        font-weight: 600;
        transition: all 0.2s ease-in-out;
        border: 1px solid transparent;
        cursor: pointer;
        font-size: 0.875rem;
      }
      .action-button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .action-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .action-button.primary {
        background-color: var(--primary-light);
        color: white;
      }
      .action-button.primary:hover:not(:disabled) {
        background-color: var(--primary-hover-light);
      }
      .dark .action-button.primary {
        background-color: var(--primary-dark);
      }
      .dark .action-button.primary:hover:not(:disabled) {
        background-color: var(--primary-hover-dark);
      }

      .action-button.secondary {
        background-color: var(--secondary-light);
        color: var(--text-primary-light);
        border-color: var(--border-light);
      }
      .action-button.secondary:hover:not(:disabled) {
        background-color: var(--secondary-hover-light);
        border-color: #d1d5db;
      }
      .dark .action-button.secondary {
        background-color: var(--secondary-dark);
        color: var(--text-primary-dark);
        border-color: var(--border-dark);
      }
      .dark .action-button.secondary:hover:not(:disabled) {
        background-color: var(--secondary-hover-dark);
      }

      .action-button.danger {
        background-color: var(--danger-light);
        color: white;
      }
      .action-button.danger:hover:not(:disabled) {
        background-color: var(--danger-hover-light);
      }
      .dark .action-button.danger {
        background-color: var(--danger-dark);
        color: var(--bg-dark);
      }
      .dark .action-button.danger:hover:not(:disabled) {
        background-color: var(--danger-hover-dark);
      }

      .theme-toggle {
        width: 2.5rem;
        height: 2.5rem;
        padding: 0;
        border-radius: 9999px;
      }

      /* Image Grid */
      .image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 1.25rem;
      }

      .image-grid-item {
        position: relative;
        aspect-ratio: 1 / 1;
        border-radius: 0.75rem;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        border: 2px solid transparent;
      }
      .image-grid-item:hover {
        transform: scale(1.03);
        z-index: 5;
      }

      .image-grid-item.sorted {
        border-color: var(--primary-light);
      }
      .dark .image-grid-item.sorted {
        border-color: var(--primary-dark);
      }
      .image-grid-item.drag-over-target {
        box-shadow: 0 0 0 4px var(--primary-light);
      }
      .dark .image-grid-item.drag-over-target {
        box-shadow: 0 0 0 4px var(--primary-dark);
      }

      .image-grid-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }
      .image-grid-item:hover img {
        transform: scale(1.1);
      }

      .image-grid-item-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        transition: background 0.3s;
        z-index: 2;
      }
      .image-grid-item:hover .image-grid-item-overlay {
        background: rgba(0, 0, 0, 0.4);
      }

      .image-grid-item-overlay-button {
        position: absolute;
        width: 2rem;
        height: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(15, 23, 42, 0.6);
        color: white;
        border-radius: 9999px;
        border: none;
        cursor: pointer;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.3s, transform 0.3s;
        z-index: 5;
      }
      .image-grid-item:hover .image-grid-item-overlay-button {
        opacity: 1;
        transform: translateY(0);
      }
      .image-grid-item-overlay-button:hover {
        background-color: rgba(15, 23, 42, 0.9);
        transform: scale(1.1) !important;
      }

      .image-grid-item-remove-button {
        top: 0.5rem;
        right: 0.5rem;
      }
      .image-grid-item-zoom-button {
        bottom: 0.5rem;
        left: 0.5rem;
        transition-delay: 0.05s;
      }

      .image-grid-item-badge {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        background-color: rgba(15, 23, 42, 0.7);
        color: white;
        font-size: 0.875rem;
        font-weight: 600;
        width: 1.75rem;
        height: 1.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        z-index: 3;
        pointer-events: none;
        border: 1px solid rgba(255,255,255,0.2);
      }
      
      .image-grid-item-sorted-indicator {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 9999px;
        background-color: var(--primary-light);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
        pointer-events: none;
        opacity: 0;
        transform: scale(0.5);
        transition: all 0.2s ease-out;
      }
      .image-grid-item.sorted .image-grid-item-sorted-indicator {
        opacity: 1;
        transform: scale(1);
      }
      .dark .image-grid-item-sorted-indicator {
        background-color: var(--primary-dark);
      }


      /* Placeholders */
      .placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 15rem;
        border: 2px dashed var(--border-light);
        border-radius: 1rem;
        text-align: center;
        color: var(--text-secondary-light);
        padding: 2rem;
      }
      .dark .placeholder {
        border-color: var(--border-dark);
        color: var(--text-secondary-dark);
      }
      
      .placeholder-full-page {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 50vh;
        border: 3px dashed var(--border-light);
        border-radius: 1.5rem;
        text-align: center;
        color: var(--text-secondary-light);
        padding: 2rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .dark .placeholder-full-page {
        border-color: var(--border-dark);
        color: var(--text-secondary-dark);
      }
      .placeholder-full-page:hover {
        border-color: var(--primary-light);
        background-color: #fcfdff;
      }
      .dark .placeholder-full-page:hover {
        border-color: var(--primary-dark);
        background-color: #050a1e;
      }
      .placeholder-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }


      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 1rem;
        backdrop-filter: blur(5px);
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      .modal-content {
        position: relative;
        max-width: 95vw;
        max-height: 95vh;
        animation: scaleUp 0.3s ease;
      }
      @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      .modal-image {
        display: block;
        max-width: 100%;
        max-height: 90vh;
        object-fit: contain;
        border-radius: 0.75rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .modal-close-button {
        position: absolute;
        top: -1.25rem;
        right: -1.25rem;
        width: 2.5rem;
        height: 2.5rem;
        background-color: rgba(255, 255, 255, 0.9);
        color: black;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        font-weight: bold;
        cursor: pointer;
        border: none;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s, background-color 0.2s;
      }
      .modal-close-button:hover {
        transform: scale(1.1) rotate(90deg);
        background-color: white;
      }

      /* Swap Controls */
      .swap-controls {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }
      .swap-input {
        width: 120px;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border-light);
        background-color: var(--bg-light);
        color: var(--text-primary-light);
        text-align: center;
        font-weight: 500;
        transition: border-color 0.2s, box-shadow 0.2s;
        -moz-appearance: textfield;
      }
      .swap-input::-webkit-inner-spin-button,
      .swap-input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .dark .swap-input {
        border-color: var(--border-dark);
        background-color: var(--card-bg-dark);
        color: var(--text-primary-dark);
      }
      .swap-input:focus {
        outline: none;
        border-color: var(--primary-light);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
      }
      .dark .swap-input:focus {
        border-color: var(--primary-dark);
      }
      .swap-icon {
        color: var(--text-secondary-light);
      }
      .dark .swap-icon {
        color: var(--text-secondary-dark);
      }
      .swap-controls .action-button {
          padding: 0.5rem 1rem;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>

</head>
  <body>
    <div id="root"></div>
